<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Фото — AI Music Gift</title>

  <link rel="stylesheet" href="styles-v6.css?v=8" />
</head>

<body>
  <main class="shell">
    <header class="page-head">
      <a class="back" href="style.html" data-i18n="uploadBack">
        ← Назад до стилю
      </a>

      <h1 class="page-title" data-i18n="uploadTitle">
        Додайте фото для відео
      </h1>

      <p class="lead" style="font-size:15px" data-i18n="uploadSubtitle">
        Фото допоможе зробити привітання більш особистим.
      </p>
    </header>

    <section class="form">
      <div class="upload-box">
        <div style="font-size:46px">📸</div>

        <h2 data-i18n="uploadBoxTitle">
          Завантажте 1–5 фото
        </h2>

        <p class="small-text" style="font-size:14px" data-i18n="uploadBoxText">
          У MVP це поки макет. Реальне завантаження підключимо наступним кроком.
        </p>

        <input class="input" type="file" multiple accept="image/*">
      </div>

      <a class="btn btn-primary" style="margin-top:22px" href="tariffs.html" data-i18n="uploadNext">
        Далі — обрати тариф
      </a>
    </section>

    <nav class="bottom-nav">
      <a href="index.html">
        <b>♡</b>
        <span data-i18n="navHome">Головна</span>
      </a>

      <a href="demos.html">
        <b>▶</b>
        <span data-i18n="navDemos">Демо</span>
      </a>

      <a href="tariffs.html">
        <b>₴</b>
        <span data-i18n="navTariffs">Тарифи</span>
      </a>

      <a href="order.html">
        <b>✎</b>
        <span data-i18n="navOrder">Замовити</span>
      </a>
    </nav>
  </main>

  <script src="translations.js?v=7"></script>
  <script src="app.js"></script>
</body>
</html>
