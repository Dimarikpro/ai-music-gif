<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Замовлення — AI Music Gift</title>
  <link rel="stylesheet" href="styles-v6.css">
</head>

<body>
  <main class="shell">
    <header class="page-head">
      <a class="back" href="index.html">← Назад на головну</a>

      <h1 class="page-title" data-i18n="orderTitle">
        Кому створюємо привітання?
      </h1>

      <p class="lead" style="font-size:15px" data-i18n="orderSubtitle">
        Кілька відповідей — і ми підберемо стиль пісні.
      </p>
    </header>

    <section class="form">
      <div class="field">
        <label class="label" data-i18n="recipientLabel">
          Для кого подарунок?
        </label>

        <select class="select">
          <option>Для коханої людини</option>
          <option>Для мами</option>
          <option>Для тата</option>
          <option>Для друга / подруги</option>
          <option>Для дитини</option>
        </select>
      </div>

      <div class="field">
        <label class="label" data-i18n="occasionLabel">
          Привід
        </label>

        <select class="select">
          <option>День народження</option>
          <option>Річниця</option>
          <option>Весілля</option>
          <option>Просто сказати “люблю”</option>
          <option>Інший привід</option>
        </select>
      </div>

      <div class="field">
        <label class="label" data-i18n="nameLabel">
          Ім’я людини
        </label>

        <input class="input" placeholder="Наприклад: Олена">
      </div>

      <div class="field">
        <label class="label" data-i18n="detailsLabel">
          Що важливо згадати?
        </label>

        <textarea class="textarea" placeholder="Кілька фактів, спогадів, теплих слів..."></textarea>
      </div>

      <a class="btn btn-primary" href="style.html" data-i18n="nextButton">
        Далі — обрати стиль
      </a>
    </section>

    <nav class="bottom-nav">
      <a href="index.html">
        <b>♡</b>
        <span data-i18n="navHome">Головна</span>
      </a>

      <a href="demos.html">
        <b>▶</b>
        <span data-i18n="navDemos">Демо</span>
      </a>

      <a href="tariffs.html">
        <b>₴</b>
        <span data-i18n="navTariffs">Тарифи</span>
      </a>

      <a href="order.html">
        <b>✎</b>
        <span data-i18n="navOrder">Замовити</span>
      </a>
    </nav>
  </main>

  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
