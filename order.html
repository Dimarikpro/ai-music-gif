<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Замовлення пісні — AI Music Gift</title>
  <link rel="stylesheet" href="styles-v6.css?v=10" />
</head>

<body>
<main class="shell">
  <header class="page-head">
    <a class="back" href="index.html">← Назад</a>
    <h1 class="page-title">Замовлення персональної пісні</h1>
    <p class="lead">Заповніть кілька деталей — і ми створимо пісню саме для вашої людини.</p>
  </header>

  <section class="form">

    <div class="field">
      <label class="label">Оберіть формат</label>
      <div class="plan-toggle">
        <label class="plan-card">
          <input type="radio" name="songPlan" value="quick" checked>
          <strong>Швидка пісня</strong>
          <span>Теплий подарунок, мінімум питань, 24–48 годин.</span>
        </label>

        <label class="plan-card">
          <input type="radio" name="songPlan" value="story">
          <strong>Пісня з історією</strong>
          <span>Більше деталей, глибше попадання, особистий сенс.</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="label">Для кого пісня?</label>
      <select class="select">
        <option>Кохана людина</option>
        <option>Мама</option>
        <option>Тато</option>
        <option>Дитина</option>
        <option>Друг / подруга</option>
        <option>Колега</option>
        <option>Інше</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Привід</label>
      <select class="select">
        <option>День народження</option>
        <option>Річниця</option>
        <option>Весілля</option>
        <option>Подяка</option>
        <option>Підтримка</option>
        <option>Просто сказати “люблю”</option>
        <option>Інше</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Ім’я людини</label>
      <input class="input" type="text" placeholder="Наприклад: Олена">
    </div>

    <div class="field">
      <label class="label">Який настрій має бути у пісні?</label>
      <select class="select">
        <option>Ніжна</option>
        <option>Весела</option>
        <option>Романтична</option>
        <option>Душевна</option>
        <option>Зворушлива</option>
        <option>З легким гумором</option>
        <option>Енергійна</option>
        <option>Спокійна</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Які емоції має викликати пісня?</label>
      <select class="select">
        <option>Радість</option>
        <option>Сльози</option>
        <option>Усмішку</option>
        <option>Ностальгію</option>
        <option>Гордість</option>
        <option>Вдячність</option>
        <option>Відчуття любові</option>
        <option>Підтримку</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Що важливо згадати?</label>
      <textarea class="textarea" placeholder="Напишіть головні деталі: імена, спогади, події, теплі слова..."></textarea>
    </div>

    <div class="field">
      <label class="label">Що краще не згадувати?</label>
      <textarea class="textarea" placeholder="Теми, імена або події, яких краще уникати..."></textarea>
    </div>

    <div id="storyBlock" class="deep-block hidden">
      <h2>Пісня з історією</h2>
      <p>Цей блок допоможе зробити пісню глибшою і точнішою.</p>

      <div class="field">
        <label class="label">Яка у вас історія з цією людиною?</label>
        <textarea class="textarea" placeholder="Як ви познайомились, що вас пов’язує, чому ця людина важлива?"></textarea>
      </div>

      <div class="field">
        <label class="label">3–5 фактів про людину</label>
        <textarea class="textarea" placeholder="Характер, звички, мрії, робота, сім’я, спільні спогади, улюблені фрази..."></textarea>
      </div>

      <div class="field">
        <label class="label">За що ви вдячні цій людині?</label>
        <textarea class="textarea" placeholder="Напишіть простими словами, за що хочеться сказати дякую."></textarea>
      </div>

      <div class="field">
        <label class="label">Який момент має бути головним у пісні?</label>
        <textarea class="textarea" placeholder="Один головний сенс або емоція, навколо якої будується пісня."></textarea>
      </div>

      <div class="field">
        <label class="label">Чи є фраза, яку обов’язково треба вставити?</label>
        <input class="input" type="text" placeholder="Наприклад: “ти моє сонце”">
      </div>

      <div class="field">
        <label class="label">Як краще звертатися до людини?</label>
        <select class="select">
          <option>По імені</option>
          <option>Мама</option>
          <option>Кохана</option>
          <option>Сонечко</option>
          <option>Рідна</option>
          <option>Інше</option>
        </select>
      </div>

      <div class="field">
        <label class="label">Який стиль тексту ближче?</label>
        <select class="select">
          <option>Простий і щирий</option>
          <option>Поетичний</option>
          <option>Сучасний</option>
          <option>З гумором</option>
          <option>Дуже емоційний</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="label">Ваше ім’я</label>
      <input class="input" type="text" placeholder="Як до вас звертатися?">
    </div>

    <div class="field">
      <label class="label">Як з вами зв’язатися?</label>
      <select class="select">
        <option>Telegram</option>
        <option>WhatsApp</option>
        <option>Viber</option>
        <option>Телефон</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Контакт</label>
      <input class="input" type="text" placeholder="Напишіть номер телефону або нікнейм">
    </div>

    <div class="field">
      <label class="label">Коли потрібна пісня?</label>
      <select class="select">
        <option>Не терміново</option>
        <option>За 24–48 годин</option>
        <option>Терміново</option>
      </select>
    </div>

    <a class="btn btn-primary" href="style.html?lang=uk">Далі — обрати стиль пісні</a>
  </section>

  <nav class="bottom-nav">
    <a href="index.html?lang=uk"><b>♡</b><span>Головна</span></a>
    <a href="demos.html?lang=uk"><b>▶</b><span>Демо</span></a>
    <a href="tariffs.html?lang=uk"><b>₴</b><span>Тарифи</span></a>
    <a href="order.html?lang=uk"><b>✎</b><span>Замовити</span></a>
  </nav>
</main>

<script>
  const radios = document.querySelectorAll('input[name="songPlan"]');
  const storyBlock = document.getElementById('storyBlock');

  radios.forEach((radio) => {
    radio.addEventListener('change', () => {
      if (radio.value === 'story' && radio.checked) {
        storyBlock.classList.remove('hidden');
      }

      if (radio.value === 'quick' && radio.checked) {
        storyBlock.classList.add('hidden');
      }
    });
  });
</script>

<script src="app.js"></script>
</body>
</html>
